[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-hub"
version = "0.1.0"
description = "A launcher that says how much its 'this will run' actually means"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
tool-hub = "tool_hub.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["tool_hub"]
omit = ["*/render.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The fixture directory holds tool modules that are DELIBERATELY broken -- one will not parse
# at all. A per-file-ignore cannot suppress a syntax error, so the directory is excluded.
extend-exclude = ["data/tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
