name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # Rich wraps to the terminal width, and a CI runner reports 80. The greps below assert
      # on whole sentences, so give it room rather than asserting on fragments.
      COLUMNS: "200"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests data

      - name: The corpus is reproducible, and the generator owns its directory
        run: |
          # A stale fixture written to an older field convention once parsed as a tool with
          # empty metadata and no error anywhere, taking the count from 12 to 19.
          touch data/tools/stale_leftover.py
          python data/generate.py
          test ! -f data/tools/stale_leftover.py
          test "$(ls data/tools/*.py | wc -l)" -eq 17

      - name: Test
        run: pytest -q --cov=tool_hub --cov-report=term-missing

      - name: Doctor runs with no network and no credentials
        run: preflight doctor

      - name: The ladder is ordered and its top rung is not a check
        run: |
          python - <<'PY'
          from tool_hub.models import SOUNDNESS_NOTES, Soundness
          from tool_hub.probe import ladder_summary

          assert list(Soundness) == sorted(Soundness), "the rungs must ascend"
          assert Soundness.DECLARED < Soundness.PRESENT < Soundness.IMPORTABLE_HERE
          assert Soundness.IMPORTABLE_HERE < Soundness.IMPORTABLE_THERE < Soundness.RAN

          for rung in Soundness:
              cost, leaves_open = SOUNDNESS_NOTES[rung]
              assert cost.strip() and leaves_open.strip(), rung

          # The top rung is the event a check predicts, and it says so.
          assert "not a check" in SOUNDNESS_NOTES[Soundness.RAN][1]
          # And the one below it still admits it is a forecast.
          assert "prediction" in SOUNDNESS_NOTES[Soundness.IMPORTABLE_THERE][1]

          levels = [level for _, level, _, _ in ladder_summary()]
          assert levels == sorted(levels) and len(levels) == len(Soundness)
          print("5 rungs, ascending, and the top one is not a check")
          PY

      - name: find_spec proves presence, not importability
        run: |
          mkdir -p /tmp/th_ci
          printf 'raise ImportError("this body fails")\n' > /tmp/th_ci/body_raises.py
          PYTHONPATH=/tmp/th_ci python - <<'PY'
          import importlib.util

          from tool_hub.models import Soundness
          from tool_hub.probe import (
              climb, disagreements, highest_attempted, importable_here, present,
              superseded, verdict,
          )

          # The exact expression three portfolio conftests use, disagreeing with reality.
          assert importlib.util.find_spec("body_raises") is not None
          try:
              __import__("body_raises")
              raise AssertionError("the body was supposed to raise")
          except ImportError:
              pass

          cheap, dear = present("body_raises"), importable_here("body_raises")
          assert cheap.ok is True and cheap.executed_code is False
          assert dear.ok is False and dear.executed_code is True
          assert "RAN as far as it got" in dear.detail

          # THE defect this project is about, guarded here: the verdict must come from the
          # DEAREST rung attempted, not from the best news on the ladder.
          results = climb("body_raises")
          assert highest_attempted(results) is Soundness.IMPORTABLE_HERE
          assert verdict(results).ok is False
          assert {r.reached for r in superseded(results)} == {
              Soundness.DECLARED, Soundness.PRESENT
          }
          assert any("PRESENT says True" in label for label, _ in disagreements(results))

          # A working module produces no disagreement at all.
          clean = climb("json")
          assert disagreements(clean) == [] and superseded(clean) == []
          assert verdict(clean).ok is True

          # Absence is reliable even though presence is not.
          assert "Absence here IS reliable" in present("definitely_not_installed_xyz").detail
          print("PRESENT says True for a module that cannot be imported")
          PY

      - name: The only sound check is an import, and it is not free
        run: |
          mkdir -p /tmp/th_ci
          printf 'from pathlib import Path\nPath("/tmp/th_ci/SIDE_EFFECT").write_text("ran")\n' \
            > /tmp/th_ci/writes_a_file.py
          rm -f /tmp/th_ci/SIDE_EFFECT
          PYTHONPATH=/tmp/th_ci python - <<'PY'
          from pathlib import Path

          from tool_hub.models import ProbeResult, Soundness
          from tool_hub.probe import importable_here, present

          marker = Path("/tmp/th_ci/SIDE_EFFECT")
          present("writes_a_file")
          assert not marker.exists(), "the cheap rung must not run anything"
          importable_here("writes_a_file")
          assert marker.exists(), "the sound rung reaches its answer BY running the body"

          # The model refuses to let a rung lie about what it cost.
          for bad in (
              dict(reached=Soundness.IMPORTABLE_HERE, executed_code=False),
              dict(reached=Soundness.PRESENT, executed_code=True),
          ):
              try:
                  ProbeResult(name="x", ok=True, detail="", **bad)
                  raise AssertionError(f"{bad} should not validate")
              except Exception:
                  pass
          print("verification and the thing verified are the same act")
          PY

      - name: A wrong-namespace requirement is unsatisfiable, not merely failing
        run: |
          python - <<'PY'
          from tool_hub.models import Resolution
          from tool_hub.naming import (
              KNOWN_DIFFERENT, circularity_note, classify, from_metadata,
              looks_like_a_module, metadata_coverage, normalise_distribution, resolve,
              unsatisfiable_names,
          )
          from tool_hub.probe import present

          # `import python-dateutil` is a syntax error, so no installation makes it pass.
          result = present("python-dateutil")
          assert result.ok is False and result.unsatisfiable is True
          assert "no installation makes this pass" in result.detail
          assert not looks_like_a_module("python-dateutil")
          assert classify("python-dateutil").value == "distribution"

          # THE HONEST LIMIT: `pillow` is a valid identifier, so inspection cannot catch it.
          found = dict(unsatisfiable_names(["python-dateutil", "pillow", "requests"]))
          assert "python-dateutil" in found and "pillow" not in found
          assert present("pillow").unsatisfiable is False
          assert classify("pillow").value == "unknown"

          # THE CIRCULARITY: the authoritative answer needs the package to be there already.
          assert from_metadata("pydantic") is not None
          assert from_metadata("scikit-learn") is None
          assert "had its answer already" in circularity_note("pydantic")
          assert "needs the answer in order to ask the question" in circularity_note(
              "scikit-learn"
          )

          # Every source, and only metadata is authoritative.
          sources = {}
          for name in ("pydantic", "scikit-learn", "some_unknown_thing", "not a name!"):
              sources[name] = resolve(name)
          assert {r.resolution for r in sources.values()} == set(Resolution)
          assert sources["pydantic"].authoritative is True
          assert sources["scikit-learn"].authoritative is False
          assert sources["scikit-learn"].module == "sklearn"
          assert "goes stale" in sources["scikit-learn"].detail
          assert sources["not a name!"].module is None

          # The table is deliberately small, and PEP 503 normalised on lookup.
          assert 5 <= len(KNOWN_DIFFERENT) <= 30
          assert resolve("Scikit_Learn").module == "sklearn"
          assert normalise_distribution("PyYAML") == "pyyaml"

          # And the sound route is not universal, which is why the table exists at all.
          with_top, without_top, examples = metadata_coverage()
          assert with_top > 0 and without_top > 0 and examples
          print(f"unsatisfiable proven; {with_top} dists ship top_level.txt, {without_top} do not")
          PY

      - name: The answer belongs to an interpreter, not a machine
        run: |
          python - <<'PY'
          import sys

          from tool_hub.interpreter import ask_everywhere, candidates, identify, resolve
          from tool_hub.models import Soundness
          from tool_hub.probe import importable_there

          assert sys.executable in candidates()
          assert len(candidates()) == len(set(candidates()))
          assert identify(sys.executable) is not None
          assert identify("/does/not/exist/python") is None

          # A tool that declares nothing gets the launcher's own, silently.
          substituted = resolve("")
          assert substituted.substituted is True and substituted.usable
          assert "never asked for" in substituted.detail

          # A declared interpreter that is absent caps everything at the wrong place.
          missing = resolve("/opt/vendor/bin/python3.9")
          assert missing.usable is False and missing.substituted is False
          assert "WRONG interpreter" in missing.detail
          rung = importable_there("json", "/opt/vendor/bin/python3.9")
          assert rung.ok is False and rung.reached is Soundness.DECLARED
          assert "Nothing was established" in rung.detail

          # The top rung works, and still calls itself a prediction.
          top = importable_there("json", sys.executable)
          assert top.ok is True and top.reached is Soundness.IMPORTABLE_THERE
          assert top.executed_code is True and "still a prediction" in top.detail

          # A module absent everywhere agrees everywhere; an unusable interpreter is SKIPPED
          # rather than recorded False, because that would report an answer nobody gave.
          agreed = ask_everywhere("definitely_not_installed_xyz", candidates())
          assert set(agreed.answers.values()) == {False} and not agreed.disagrees
          assert ask_everywhere("json", ["/does/not/exist/python"]).answers == {}
          assert "no interpreter could be asked" in ask_everywhere("json", []).summary()

          # And where the interpreters DO disagree, say which python you asked.
          split = ask_everywhere("pydantic", candidates())
          if split.disagrees:
              assert "which python you asked" in split.summary()
          else:
              assert "not a general result" in split.summary()
          print(f"asked {len(split.answers)} interpreters; disagree={split.disagrees}")
          PY

      - name: Listing the tools runs the tools, and loses the broken ones
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          from tool_hub.discover import (
              FIELDS, compare, discover_imported, discover_static, read_static_values,
          )

          tools = Path("data/tools")
          marker = tools / "IMPORT_SIDE_EFFECT"
          marker.unlink(missing_ok=True)

          # Static is read-only. This is the whole reason it is the default.
          static = discover_static(tools)
          assert static.executed_code is False
          assert not marker.exists(), "listing tools must not run them"
          assert len(static.tools) == 16
          assert dict(static.lost).keys() == {"syntax_error"}

          # Importing is not read-only, and the result says so.
          before = list(sys.path)
          imported = discover_imported(tools)
          assert imported.executed_code is True
          assert marker.exists(), "the import-based listing executed a module body"
          assert sys.path == before, "sys.path must be restored"

          # And it LOSES exactly the broken tool -- the one a listing most needs to mention.
          result = compare(tools)
          assert result.only_static == ("broken_import",)
          assert result.only_imported == (), "importing cannot find a file the parser missed"
          assert result.imported_count < result.static_count
          assert "healthier than the directory" in result.summary()

          # The AST knows what it cannot say, which differs from being wrong.
          computed = dict(result.unevaluated_by_ast)
          assert len(computed) == 4
          assert all(k.startswith("detect_platform.") for k in computed)
          differing = dict(result.differing_metadata)
          assert "detect_platform.TOOL_NAME" in differing

          # Declarations that DID evaluate and are still unusable.
          assert all(f.startswith("TOOL_") for f in FIELDS), "one convention, or fixtures vanish"
          malformed = dict(static.malformed)
          assert "bad_metadata.TOOL_NAME" in malformed
          assert "bad_metadata.TOOL_REQUIREMENTS" in malformed
          assert "4 single-character names" in malformed["bad_metadata.TOOL_REQUIREMENTS"]
          # A literal None must not become a tool called "None".
          assert "None" not in {t.name for t in static.tools}

          # A literal None and a computed value BOTH carry value=None; only `literal` separates.
          literal_none = read_static_values("TOOL_NAME = None\n")["TOOL_NAME"]
          calculated = read_static_values('TOOL_NAME = "a" + "b"\n')["TOOL_NAME"]
          assert literal_none.value is calculated.value is None
          assert literal_none.literal is True and calculated.literal is False
          print(f"static {result.static_count}, imported {result.imported_count}, side effect written")
          PY

      - name: Ranking by launches is pushed up by failure
        run: |
          python - <<'PY'
          from pathlib import Path

          from tool_hub.models import UsageRecord
          from tool_hub.usage import invisible_tools, rank, record_launch, retry_inflation

          records = [UsageRecord(**r) for r in __import__("json").loads(
              Path("data/usage.json").read_text()
          )]
          result = rank(records)

          # "Used most" does not have one answer, and they disagree about FIRST PLACE.
          assert result.orders_agree is False
          assert result.top_differs is True
          assert result.by_launched[0] == "date-shift"
          assert result.by_succeeded[0] == "csv-merge"
          assert "does not have one answer" in result.summary()
          assert "made it look more popular" in result.summary()

          # The tool ranked first by launches is the one that mostly fails.
          worst = next(r for r in records if r.name == "date-shift")
          assert worst.launched == 58 and worst.succeeded == 4
          assert "93%" in retry_inflation(worst)
          assert "trying again after it failed" in retry_inflation(worst)

          # A tool that always works is not inflated, and 0/0 is not a rate.
          assert "Nothing here is inflated" in retry_inflation(
              UsageRecord(name="g", launched=5, succeeded=5)
          )
          assert UsageRecord(name="n", launched=0, succeeded=0).success_rate is None
          assert "no ranking at all" in retry_inflation(
              UsageRecord(name="n", launched=0, succeeded=0)
          )

          # Only `launched` moves on failure. That asymmetry IS the finding.
          after = record_launch([], "x", succeeded=False)
          assert (after[0].launched, after[0].succeeded) == (1, 0)
          again = record_launch(after, "x", succeeded=True)
          assert (again[0].launched, again[0].succeeded) == (2, 1)

          # A tool cannot succeed more often than it was launched.
          try:
              UsageRecord(name="x", launched=1, succeeded=2)
              raise AssertionError("should not validate")
          except Exception:
              pass

          assert invisible_tools(records, ["csv-merge", "never-seen"]) == ("never-seen",)
          print("first by launches is the tool that fails 93% of the time")
          PY

      - name: The report publishes a ceiling and never says ready
        run: |
          preflight report -o /tmp/out || true
          python - <<'PY'
          import json

          payload = json.load(open("/tmp/out/report.json"))
          assert payload["tools"] == 16
          assert payload["lost"] == ["syntax_error"]
          assert payload["unsatisfiable"] == [
              "date_shift:python-dateutil",
              "unknown_dist:some-internal-helper-lib",
          ]
          assert payload["malformed_declarations"] == [
              "bad_metadata.TOOL_NAME",
              "bad_metadata.TOOL_REQUIREMENTS",
          ]
          assert len(payload["unevaluated_by_ast"]) == 4
          assert payload["missing_interpreters"] == ["vendor_sync:/opt/vendor/bin/python3.9"]
          assert sorted(payload["substituted_interpreters"]) == [
              "detect_platform", "no_interpreter"
          ]
          assert payload["probably_binaries"] == ["repo_stats:git"]

          # The ceiling is capped by the interpreter, not by the requirements.
          assert payload["ceilings"]["vendor_sync"] == "PRESENT"
          assert payload["ceilings"]["csv_merge"] == "IMPORTABLE_THERE"

          assert payload["rank_orders_agree"] is False
          assert payload["rank_by_launched"][0] == "date-shift"
          assert payload["rank_by_succeeded"][0] == "csv-merge"
          # Nine, and two of them -- bad_metadata and detect_platform -- are listed under
          # their MODULE names because the launcher could not read their TOOL_NAME. A tool
          # whose name cannot be read cannot be matched to its own usage history either.
          assert len(payload["never_launched"]) == 9
          assert "bad_metadata" in payload["never_launched"]
          assert "detect_platform" in payload["never_launched"]
          print(f"{payload['tools']} tools; ceiling capped to PRESENT where the interpreter is absent")
          PY

      - name: check gates on what an author can fix, not on the world
        run: |
          ! preflight check
          preflight check | grep -q 'written in the distribution namespace'
          preflight check | grep -q 'date_shift:python-dateutil'
          preflight check | grep -q 'wrong shape, which evaluate and are still unusable'
          preflight check | grep -q 'no pass can read'
          preflight check | grep -q 'declare an interpreter that is not here'
          preflight check | grep -q 'Reported and NOT failed on'
          preflight check | grep -q 'switched off inside a week'
          preflight check | grep -q 'FAIL'

          # A tool whose dependency is genuinely ABSENT still passes, because a missing
          # package is not something a tool's author can fix in their own source.
          mkdir -p /tmp/clean
          cat > /tmp/clean/fine.py <<'TOOL'
          TOOL_NAME = "fine"
          TOOL_REQUIREMENTS = ["definitely_not_installed_xyz"]
          TOOL_INTERPRETER = "python3"
          TOOL
          TH_TOOLS=/tmp/clean preflight check
          TH_TOOLS=/tmp/clean preflight check | grep -q 'Nothing fixable at source'
          TH_TOOLS=/tmp/clean preflight check | grep -q 'still a prediction'
          TH_TOOLS=/tmp/clean preflight check | grep -q PASS

          # ...but a requirement in the wrong NAMESPACE does fail, because that is fixable.
          mkdir -p /tmp/wrongns
          printf 'TOOL_NAME = "x"\nTOOL_REQUIREMENTS = ["python-dateutil"]\nTOOL_INTERPRETER = "python3"\n' \
            > /tmp/wrongns/x.py
          ! TH_TOOLS=/tmp/wrongns preflight check
          echo "an absent package does not gate; a wrong namespace does"

      - name: launch declines to launch, and refuses when it cannot know
        run: |
          preflight launch csv_merge | grep -q 'Not launching'
          preflight launch csv_merge | grep -q 'would settle'
          preflight launch csv_merge | grep -q 'prediction, not a guarantee'
          ! preflight launch date_shift
          preflight launch date_shift | grep -q 'a claim with nothing behind it' || true
          ! preflight launch vendor_sync
          ! preflight launch no_such_tool
          echo "launch predicts and declines; it refuses when the evidence is unobtainable"

      - name: Every command publishes its reasoning
        run: |
          preflight doctor | grep -q 'none used, ever'
          preflight doctor | grep -q 'listing tools does not run them'
          preflight doctor | grep -q 'import SEMANTICS, verifiable here'
          preflight doctor | grep -q 'resting on PACKAGING behaviour'
          preflight doctor | grep -q 'GUESSES, and go stale'
          preflight doctor | grep -q 'invented, not measured'
          preflight ladder | grep -q 'PREDICTION ABOUT A PROCESS IT IS NOT RUNNING'
          preflight ladder | grep -q 'NONE PROVES THE NEXT'
          preflight ladder | grep -q 'not a check'
          preflight probe json | grep -q 'the dearest question asked'
          preflight probe python-dateutil | grep -q 'UNSATISFIABLE'
          preflight probe git | grep -q 'Strong evidence'
          preflight probe definitely_not_installed_xyz | grep -q 'KIND is unknown'
          preflight naming | grep -q 'Two NAMESPACES, not two'
          preflight naming scikit-learn | grep -q 'unknowable from the system'
          preflight discover | grep -q 'WITHOUT executing anything'
          preflight discover --run-imports | grep -q 'looks healthier than the directory'
          preflight discover --run-imports | grep -q 'the AST KNOWS it cannot say'
          preflight interpreters | grep -q 'SUBSTITUTED'
          preflight interpreters | grep -q 'an environment the tool never asked for'
          preflight usage | grep -q 'does not have one answer'
          preflight usage | grep -q 'failure pushes UP the number'
          preflight usage | grep -q 'cannot tell which of three'
          preflight explain date_shift | grep -q 'no installation makes the check pass'
          preflight explain csv_merge | grep -q 'prediction, not a guarantee'
          preflight explain syntax_error | grep -q 'it IS on disk, and unreadable'
          echo "all commands explain themselves"

  test-windows:
    # The Linux job runs the full suite plus this project's own checks. This job runs the
    # test suite on Windows, where the default encoding is cp1252 and paths use backslashes:
    # several projects in this portfolio shipped bugs that only failed there.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q
